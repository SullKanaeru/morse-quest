version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: morsequest-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    container_name: morsequest-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=${PORT}
      - DB_URL=host=db user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} port=5432 sslmode=disable
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db

volumes:
  pgdata:
